name: Test and publish Keycloak mail provider
on:
  push:
    branches: [main]
    paths: ['keycloak-provider/**', '.github/workflows/keycloak.yml']
  pull_request:
    paths: ['keycloak-provider/**', '.github/workflows/keycloak.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: keycloak-provider/pom.xml
      - run: mvn -B -f keycloak-provider/pom.xml verify
  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: keycloak-provider
          file: keycloak-provider/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-keycloak:sha-${{ github.sha }}
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,scope=keycloak,mode=max
